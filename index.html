<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>초등 3부 햇살반 · 수업 도구</title>
<style>
  :root {
    --bg: #F6F1E1;
    --ink: #2C3E50;
    --ink-soft: rgba(44, 62, 80, 0.68);
    --line: rgba(44, 62, 80, 0.16);
    --sun: #E9A82B;
    --tap: 56px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }
  html {
    scroll-padding-top: env(safe-area-inset-top, 0px);
    scrollbar-gutter: stable;
  }
  *, *::before, *::after { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", "Nanum Gothic", system-ui, sans-serif;
    font-size: 20px;
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  .page {
    max-width: none;
    margin: 0;
    padding:
      20px
      max(20px, env(safe-area-inset-right, 0px), calc((100vw - 1100px) / 4 + 20px))
      32px
      max(20px, env(safe-area-inset-left, 0px), calc((100vw - 1100px) / 4 + 20px));
  }

  /* 맨 위: 반 이름과 날짜 */
  header {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 4px;
    padding-bottom: 18px;
    border-bottom: 3px solid var(--sun);
  }
  h1 {
    margin: 0;
    font-size: clamp(30px, 5vw, 44px);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.25;
  }
  .today {
    margin: 0;
    font-size: clamp(20px, 3vw, 28px);
    font-weight: 600;
    color: var(--ink-soft);
  }

  .h1-en {
    margin: 0;
    font-size: clamp(18px, 2.8vw, 28px);
    font-weight: 700;
    color: var(--ink-soft);
    line-height: 1.3;
  }
  .today-en {
    margin: 0;
    font-size: clamp(17px, 2.4vw, 24px);
    font-weight: 600;
    color: var(--ink-soft);
    line-height: 1.3;
  }
  .en { display: block; font-weight: 600; line-height: 1.3; }
  .fs-en { display: block; font-size: 12px; font-weight: 600; line-height: 1.2; opacity: 0.8; }

  header { position: relative; }
  #fs {
    position: absolute;
    top: 0;
    right: 0;
    min-height: 52px;
    padding: 4px 17px;
    font: inherit;
    font-size: 18px;
    font-weight: 700;
    line-height: 1.2;
    color: var(--ink);
    background: transparent;
    border: 2px solid var(--line);
    border-radius: 14px;
    cursor: pointer;
    touch-action: manipulation;
  }
  #fs[hidden] { display: none; }
  #fs:active { background: rgba(44, 62, 80, 0.08); }
  #fs:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }

  /* 탭 */
  [role="tablist"] {
    display: flex;
    flex-wrap: nowrap;
    gap: 6px;
    container-type: inline-size;
    margin: 22px 0 0;
    padding: 0;
  }
  [role="tab"] {
    flex: 1 1 0;
    min-width: 0;
    min-height: 68px;
    padding: 8px 4px;
    font: inherit;
    font-size: clamp(13px, 1.75vw, 26px);
    font-size: clamp(13px, 1.8cqw, 26px);
    font-weight: 800;
    line-height: 1.25;
    white-space: nowrap;
    color: var(--ink);
    background: transparent;
    border: 2px solid var(--line);
    border-radius: 14px;
    cursor: pointer;
    touch-action: manipulation;
    transition: background-color 0.15s, color 0.15s, border-color 0.15s;
  }
  [role="tab"] .en {
    font-size: clamp(10px, 1.25vw, 16px);
    font-weight: 600;
    color: inherit;
    opacity: 0.8;
  }
  [role="tab"]:active { background: rgba(44, 62, 80, 0.08); }
  [role="tab"][aria-selected="true"] {
    background: var(--ink);
    border-color: var(--ink);
    color: var(--bg);
  }
  [role="tab"]:focus-visible,
  [role="tabpanel"]:focus-visible {
    outline: 3px solid var(--sun);
    outline-offset: 3px;
  }

  /* 내용 */
  [role="tabpanel"] {
    margin-top: 18px;
    min-height: 46vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 20px;
    border: 2px dashed var(--line);
    border-radius: 18px;
  }
  [role="tabpanel"][hidden] { display: none; }
  .panel-title {
    margin: 0 0 8px;
    font-size: clamp(26px, 4vw, 34px);
    font-weight: 800;
  }
  .panel-note {
    margin: 0;
    font-size: clamp(20px, 3vw, 26px);
    color: var(--ink-soft);
  }
  .panel-title-en {
    margin: 0 0 14px;
    font-size: clamp(20px, 3vw, 28px);
    font-weight: 700;
    color: var(--ink-soft);
  }
  .panel-note-en {
    margin: 4px 0 0;
    font-size: clamp(17px, 2.4vw, 22px);
    color: var(--ink-soft);
  }

  /* 성경 이야기 탭 */
  [role="tabpanel"].story:not([hidden]) {
    display: block;
    min-height: 0;
    padding: 0;
    border: none;
  }
  .scene { margin: 0; border-radius: 28px; overflow: hidden; background: #FFF6E0; line-height: 0; }
  .scene svg { display: block; width: 100%; height: auto; }
  .scene svg { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .drag, .drag * { touch-action: none; }
  .drag { cursor: grab; }
  .drag.dragging { cursor: grabbing; }
  .scene-nav { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; margin: 0 0 14px; }
  .scene-btn {
    width: 60px;
    min-height: 60px;
    padding: 0;
    font: inherit;
    font-size: 28px;
    font-weight: 800;
    color: var(--ink);
    background: transparent;
    border: 2px solid var(--line);
    border-radius: 16px;
    cursor: pointer;
    touch-action: manipulation;
    transition: background-color 0.15s, color 0.15s, border-color 0.15s;
  }
  .scene-btn:active { background: rgba(44, 62, 80, 0.08); }
  .scene-btn[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .scene-btn:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
  .scene-title { margin: 0 0 0 8px; font-size: clamp(24px, 3.2vw, 34px); font-weight: 900; line-height: 1.3; }
  .scene-view[hidden] { display: none; }
  .scene-empty {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 46vh;
    padding: 24px;
    border: 2px dashed var(--line);
    border-radius: 18px;
    font-size: clamp(22px, 3vw, 28px);
    color: var(--ink-soft);
    text-align: center;
  }
  .story-actions { display: flex; justify-content: center; margin-top: 16px; }

  /* 함께 생각해 볼까요? */
  .think { margin-top: 22px; }
  .think-toggle {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    width: 100%;
    min-height: 68px;
    padding: 8px 24px;
    font: inherit;
    font-size: clamp(24px, 3vw, 30px);
    font-weight: 900;
    color: var(--ink);
    background: #FFF3D6;
    border: 2px solid var(--line);
    border-radius: 18px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .think-toggle:active { background: #F6E2B0; }
  .think-toggle:focus-visible, .think-card:focus-visible, .tf-btn:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
  .think-chevron {
    width: 14px;
    height: 14px;
    border-right: 4px solid var(--ink);
    border-bottom: 4px solid var(--ink);
    transform: translateY(-4px) rotate(45deg);
    transition: transform 0.15s;
  }
  .think-toggle[aria-expanded="true"] .think-chevron { transform: translateY(4px) rotate(-135deg); }
  .think-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; margin-top: 14px; }
  .think-cards[hidden] { display: none; }
  .think-card {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 14px;
    min-height: 170px;
    padding: 22px 22px 24px;
    font: inherit;
    text-align: left;
    color: var(--ink);
    background: var(--c);
    border: 0;
    border-radius: 26px;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.12s;
  }
  .think-card:active { transform: scale(.98); }
  .think-num, .tf-num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--bg);
    font-size: 26px;
    font-weight: 900;
  }
  .think-q { font-size: clamp(22px, 2.6vw, 30px); font-weight: 800; line-height: 1.45; word-break: keep-all; }

  .think-full {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    background: var(--c, #FFF3D6);
    color: var(--ink);
    padding: max(16px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
    touch-action: pan-y;
  }
  .think-full[hidden] { display: none; }
  .tf-top { display: flex; justify-content: flex-end; }
  .tf-btn {
    min-height: 64px;
    min-width: 64px;
    padding: 0 28px;
    font: inherit;
    font-size: 26px;
    font-weight: 800;
    color: var(--ink);
    background: rgba(255, 255, 255, 0.65);
    border: 2px solid rgba(44, 62, 80, 0.2);
    border-radius: 18px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .tf-btn:active { background: rgba(255, 255, 255, 0.95); }
  .tf-btn:disabled { opacity: .35; cursor: default; }
  .tf-body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; text-align: center; padding: 8px 4vw; }
  .tf-num { width: clamp(72px, 9vw, 110px); height: clamp(72px, 9vw, 110px); font-size: clamp(40px, 5.4vw, 66px); }
  .tf-q { margin: 0; max-width: 1200px; font-size: clamp(38px, 6.6vw, 92px); font-weight: 900; line-height: 1.35; word-break: keep-all; }
  .tf-nav { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .tf-nav .tf-btn { min-height: 72px; min-width: 150px; font-size: 30px; }
  .tf-dots { display: flex; gap: 12px; }
  .tf-dots span { width: 16px; height: 16px; border-radius: 50%; background: rgba(44, 62, 80, 0.25); }
  .tf-dots span.on { background: var(--ink); }
  .reset-btn {
    min-height: 60px;
    padding: 0 40px;
    font: inherit;
    font-size: 24px;
    font-weight: 800;
    color: var(--ink);
    background: #FFF3D6;
    border: 2px solid var(--line);
    border-radius: 16px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .reset-btn:active { background: #F6E2B0; }
  .reset-btn:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }

  /* 공과 탭 */
  [role="tabpanel"].lesson:not([hidden]) {
    display: block;
    min-height: 0;
    padding: 0;
    border: none;
    text-align: center;
  }
  .cover {
    padding: clamp(26px, 4.5vw, 52px) clamp(12px, 2vw, 24px);
    border-radius: 32px;
    background:
      radial-gradient(circle at 12% 8%, rgba(255, 255, 255, 0.65) 0 90px, transparent 91px),
      linear-gradient(135deg, #FFDCC0 0%, #FFEFB5 48%, #D5EFDF 100%);
    word-break: keep-all;
  }
  .cover-title {
    margin: 0;
    font-size: clamp(50px, 10vw, 96px);
    font-weight: 900;
    letter-spacing: -0.03em;
    line-height: 1.15;
  }
  .cover-sub {
    margin: 10px 0 0;
    font-size: clamp(28px, 4.8vw, 44px);
    font-weight: 700;
  }
  .cover-title-en {
    margin: 4px 0 0;
    font-size: clamp(26px, 4.6vw, 46px);
    font-weight: 800;
    color: var(--ink-soft);
    line-height: 1.2;
  }
  .cover-sub-en {
    margin: 4px 0 0;
    font-size: clamp(20px, 3.4vw, 32px);
    font-weight: 700;
    color: var(--ink-soft);
  }
  .q-line { display: block; white-space: nowrap; }
  .q-en {
    display: block;
    margin-top: 6px;
    font-size: clamp(15px, calc((100vw - 170px) / 24), 30px);
    font-weight: 700;
    color: var(--ink-soft);
    line-height: 1.35;
  }
  .stack {
    display: grid;
    justify-content: center;
    row-gap: 24px;
    margin-top: 28px;
  }
  .cover-question {
    margin: 0;
    padding: 18px 28px;
    border-radius: 26px;
    background: rgba(255, 255, 255, 0.72);
    font-size: clamp(22px, calc((100vw - 170px) / 17.5), 46px);
    font-weight: 800;
    line-height: 1.45;
  }
  .verse {
    margin: 0;
    width: 0;
    min-width: 100%;
    padding: clamp(24px, 4vw, 44px) clamp(18px, 2.6vw, 34px);
    border-radius: 28px;
    background: #FFFCF2;
    color: var(--ink);
    border: none;
    box-shadow: none;
  }
  .verse { text-align: left; }
  .verse-head {
    margin: 0 0 14px;
    font-size: clamp(26px, 3.8vw, 40px);
    font-weight: 900;
    line-height: 1.3;
  }
  .verse-text {
    margin: 0;
    font-size: clamp(24px, 3.4vw, 38px);
    font-weight: 700;
    line-height: 1.75;
  }
  .vn {
    margin: 0 5px 0 2px;
    font-size: 0.55em;
    font-weight: 800;
    line-height: 0;
    color: rgba(44, 62, 80, 0.6);
  }
  .stack > .verse-src {
    width: 0;
    min-width: 100%;
    margin: 0;
    text-align: center;
  }

  .verse-src {
    margin: 8px 0 0;
    font-size: clamp(16px, 2vw, 19px);
    font-weight: 600;
    color: rgba(44, 62, 80, 0.62);
  }
  .verse-en {
    margin-top: clamp(20px, 3vw, 30px);
    padding-top: clamp(20px, 3vw, 30px);
    border-top: 2px solid var(--line);
    word-break: normal;
  }
  .verse-en .verse-text { font-size: clamp(22px, 3.1vw, 34px); font-weight: 600; line-height: 1.65; }
  .verse-en .verse-head { font-size: clamp(22px, 3.2vw, 32px); font-weight: 800; }

  .flow {
    margin-top: 22px;
    text-align: left;
    border: 2px solid var(--line);
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.55);
    overflow: hidden;
  }
  .flow > summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    min-height: 64px;
    padding: 10px 22px;
    font-size: 24px;
    font-weight: 800;
    cursor: pointer;
    list-style: none;
    touch-action: manipulation;
  }
  .flow > summary::-webkit-details-marker { display: none; }
  .flow > summary:focus-visible { outline: 3px solid var(--sun); outline-offset: -3px; }
  .sum-hint {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-size: 19px;
    font-weight: 600;
    color: var(--ink-soft);
  }
  .sum-hint::after {
    content: "";
    width: 12px;
    height: 12px;
    border-right: 3px solid var(--ink);
    border-bottom: 3px solid var(--ink);
    transform: translateY(-3px) rotate(45deg);
    transition: transform 0.15s;
  }
  .flow[open] .sum-hint::after { transform: translateY(3px) rotate(-135deg); }
  .flow .when-open { display: none; }
  .flow[open] .when-open { display: inline; }
  .flow[open] .when-closed { display: none; }

  .flow-list { list-style: none; margin: 0; padding: 0; }
  .flow-list li { border-top: 1px solid var(--line); }
  .step .sub { display: block; font-size: 16px; font-weight: 600; color: var(--ink-soft); line-height: 1.3; }
  .flow > summary .sub { font-size: 17px; font-weight: 600; color: var(--ink-soft); }
  .step {
    display: grid;
    grid-template-columns: 130px 1fr auto;
    align-items: center;
    gap: 12px;
    width: 100%;
    min-height: 64px;
    padding: 14px 22px;
    margin: 0;
    font: inherit;
    font-size: 22px;
    color: var(--ink);
    text-align: left;
    background: transparent;
    border: 0;
    border-radius: 0;
    cursor: pointer;
    touch-action: manipulation;
    transition: background-color 0.15s;
  }
  .step:active { background: rgba(44, 62, 80, 0.08); }
  .step:focus-visible { outline: 3px solid var(--sun); outline-offset: -3px; }
  .step[aria-pressed="true"] { background: #FBE3A0; }
  .stage { font-weight: 800; }
  .mins { font-weight: 800; text-align: right; }
  .now {
    display: none;
    margin-left: 12px;
    padding: 2px 14px;
    border-radius: 999px;
    background: var(--ink);
    color: var(--bg);
    font-size: 18px;
    font-weight: 800;
    vertical-align: 2px;
  }
  .step[aria-pressed="true"] .now { display: inline-block; }
  .step[aria-pressed="true"] .what { font-weight: 800; }

  @media (prefers-reduced-motion: reduce) {
    .sum-hint::after { transition: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    [role="tab"] { transition: none; }
  }

  /* ===== 퀴즈 ===== */
  [role="tabpanel"].quiz:not([hidden]) { display: block; min-height: 0; padding: 0; border: none; text-align: left; }
  .quiz [hidden] { display: none !important; }
  .qz-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .qz-progress { padding: 8px 24px; border-radius: 999px; background: var(--ink); color: var(--bg); font-size: clamp(22px, 3vw, 30px); font-weight: 900; }
  .qz-score { display: flex; align-items: center; gap: 8px; padding: 4px 22px; border-radius: 999px; background: #FFF0B8; border: 3px solid #F2C94C; font-size: clamp(26px, 3.6vw, 38px); font-weight: 900; }
  .qz-score .qz-star, .qz-score .qz-n { display: inline-block; }
  .qz-score .qz-n { min-width: 1.1ch; text-align: center; }
  .qz-score.pop .qz-star, .qz-score.pop .qz-n { animation: qz-pop .6s cubic-bezier(.2, 1.6, .4, 1); }
  @keyframes qz-pop { 0% { transform: scale(1); } 35% { transform: scale(1.8) rotate(-10deg); } 100% { transform: scale(1); } }
  .qz-bar { display: flex; gap: 8px; margin-bottom: 14px; }
  .qz-bar span { flex: 1; height: 12px; border-radius: 6px; background: rgba(44, 62, 80, 0.15); }
  .qz-bar span.now { background: #F2C94C; }
  .qz-bar span.ok { background: #2E9E5B; }
  .qz-bar span.no { background: #E0524D; }
  .qz-card { padding: clamp(18px, 3vw, 32px); border-radius: 28px; background: #FFF8E6; }
  .qz-ref { margin: 0 0 8px; font-size: clamp(18px, 2.3vw, 24px); font-weight: 700; color: var(--ink-soft); }
  .qz-q { margin: 0 0 clamp(16px, 2.4vw, 26px); font-size: clamp(28px, 4.4vw, 48px); font-weight: 900; line-height: 1.4; word-break: keep-all; }
  .qz-choices { display: grid; gap: 14px; }
  .qz-choice {
    display: flex; align-items: center; gap: 16px; width: 100%;
    min-height: clamp(84px, 11vh, 112px); padding: 14px 22px;
    font: inherit; font-size: clamp(24px, 3.4vw, 36px); font-weight: 800; text-align: left; word-break: keep-all;
    color: var(--ink); background: #FFFFFF; border: 4px solid rgba(44, 62, 80, 0.2); border-radius: 22px;
    cursor: pointer; touch-action: manipulation;
    transition: transform .1s, opacity .25s, background-color .2s, border-color .2s;
  }
  .qz-choice:active:not(:disabled) { transform: scale(.98); background: #FFF3D6; }
  .qz-choice:focus-visible, .qz-btn:focus-visible { outline: 3px solid var(--sun); outline-offset: 3px; }
  .qz-choice .qz-no { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 54px; height: 54px; border-radius: 50%; background: var(--ink); color: var(--bg); font-size: 30px; font-weight: 900; }
  .qz-choice:disabled { cursor: default; color: var(--ink); }
  .qz-choice.right { background: #D7F3E1; border-color: #2E9E5B; }
  .qz-choice.right .qz-no { background: #2E9E5B; }
  .qz-choice.wrong { background: #FDE0DE; border-color: #E0524D; }
  .qz-choice.wrong .qz-no { background: #E0524D; }
  .qz-choice.dim { opacity: .35; }
  .qz-feedback { margin-top: 18px; padding: 18px 24px; border-radius: 20px; font-size: clamp(22px, 3vw, 32px); font-weight: 700; line-height: 1.5; word-break: keep-all; }
  .qz-feedback.right { background: #D7F3E1; }
  .qz-feedback.wrong { background: #FDE0DE; }

  .mt-grid { --mt-u: 200px; --mt-w: 240px; --mt-ch: 240px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); gap: clamp(10px, 1.6vw, 22px); height: var(--mt-h, auto); min-height: 320px; }

  .mt-card.matched .mt-front { background: #E4F6EB; border-color: #2E9E5B; }
  .mt-no { position: absolute; top: calc(var(--mt-u) * .04); left: calc(var(--mt-u) * .07); font-size: max(14px, calc(var(--mt-u) * .075)); font-weight: 800; color: var(--ink-soft); }
  .mt-emoji { display: block; font-size: min(calc(var(--mt-ch) * .34), calc(var(--mt-w) * .4)); line-height: 1.12; }
  .mt-emoji.multi { font-size: min(calc(var(--mt-ch) * .17), calc(var(--mt-w) * .15)); }
  .mt-word { display: block; margin-top: calc(var(--mt-ch) * .02); font-size: min(calc(var(--mt-ch) * .12), calc(var(--mt-w) * .115)); font-weight: 900; line-height: 1.22; word-break: keep-all; }

  .mt-net { display: block; width: min(calc(var(--mt-w) * .8), calc(var(--mt-ch) * .46 * 1.54)); height: auto; margin: 0 auto; }

  .mt-card.bump { animation: mt-bump .5s ease; }

  @media (prefers-reduced-motion: reduce) {

      counts = {}; dirty = {};

      if (pend) pend.forEach(function (n) { if (counts.hasOwnProperty(n)) dirty[n] = true; });
      else if (hadCopy) ROSTER.forEach(function (n) { if (counts[n] > 0) dirty[n] = true; });   // 서버와 연결하기 전부터 이 기기에만 있던 숫자: 잃지 않게 처음 한 번 서버에 올림

    // ---------- Supabase 달란트 표와 주고받기 (출석 탭과 같은 방식) ----------
    function paintSync() { syncEl.hidden = !netBad; }                          // 연결이 안 될 때만 작게 "기기에만 저장 중"
    function netOk() { netBad = false; paintSync(); }

    // 못 올린 이름들의 "현재 달란트"를 한 번에 올림 (없는 줄은 새로 만들고, 있으면 고침)
    function flush() {
      var names = ROSTER.filter(function (n) { return dirty[n]; });

      var sent = {}, body = names.map(function (n) { sent[n] = counts[n]; return { nickname: n, amount: counts[n] }; });
      sbRest("talents?on_conflict=nickname", "POST", body, "resolution=merge-duplicates,return=minimal")
        .then(function () {
          names.forEach(function (n) { if (counts[n] === sent[n]) delete dirty[n]; });     // 보내는 사이 또 바뀐 이름은 다시 올림

        var remote = {};

        var missing = ROSTER.filter(function (n) { return !Object.prototype.hasOwnProperty.call(remote, n); });
        var added = missing.length
          ? sbRest("talents?on_conflict=nickname", "POST", missing.map(function (n) { return { nickname: n, amount: 0 }; }), "resolution=ignore-duplicates,return=minimal")
          : Promise.resolve();

            if (Object.prototype.hasOwnProperty.call(remote, n)) { var v = Math.floor(Number(remote[n])); counts[n] = v > 0 && v < 100000 ? v : 0; }

    // ---------- 학기 기록 꺼내기 / 다시 불러오기 ----------
    var bkBtn = $(".tl-backup"), bk = $(".tl-bk"), out = $(".tl-bk-out"), copyBtn = $(".tl-bk-copy"), closeBtn = $(".tl-bk-close"), bkMsg = $(".tl-bk-msg"),

    restoreBtn.addEventListener("click", function () {

      var found = findRecord(text);
      if (!found) { say(rMsg, "붙여 넣은 글에서 기록 한 줄을 찾지 못했어요. 꺼낸 글을 처음부터 끝까지 그대로 붙여 넣었는지 확인해 주세요.", true); return; }
      var res = checkRecord(found);
      if (!res.ok) { say(rMsg, "이 기록은 불러올 수 없어요: " + res.why, true); return; }
      rArmed = true; rText = text; rCheck = res; rAt = Date.now();                                    // 첫 번째 누름: 무엇으로 바뀌는지 보여 주고 한 번 더 확인
      restoreBtn.textContent = "정말 바꿀까요?"; restoreBtn.classList.add("arm");
      say(rMsg, "지금의 명단·출석·달란트·반 이름을 이 기록으로 바꿉니다. 한 번 더 누르면 바뀌어요. → " + res.cname + " · " + res.names.length + "명 · 출석 합계 " + sumOf(res.att, res.names) + "번 · 달란트 합계 " + sumOf(res.tal, res.names) + "개", true);

    });
    inEl.addEventListener("input", function () { if (rArmed) { rDisarm(); say(rMsg, ""); } });         // 붙여 넣은 글을 고치면 처음부터 다시

    // ---------- 화면 만들기 ----------
    load();
    function buildRows() {
    ROSTER.forEach(function (name, i) {
      var li = document.createElement("li"); li.className = "tl-row"; li.setAttribute("data-name", name);
      li.innerHTML =
        '<div class="tl-who"><span class="tl-emo" aria-hidden="true"></span><span class="tl-name"></span></div>' +
        '<div class="tl-grow"><span class="tl-medals" role="img"></span><span class="tl-n"><b></b>개</span></div>' +
        '<div class="tl-ctl"><button type="button" class="tl-btn tl-minus">−</button><button type="button" class="tl-btn tl-plus">＋</button><button type="button" class="tl-btn tl-plus5">＋5</button></div>';
      li.querySelector(".tl-emo").textContent = emojis[i];

      minus.setAttribute("aria-label", name + " 달란트 1개 빼기"); plus.setAttribute("aria-label", name + " 달란트 1개 주기"); plus5.setAttribute("aria-label", name + " 달란트 5개 주기");
      minus.addEventListener("click", function () { give(i, -1); });
      plus.addEventListener("click", function () { give(i, +1); });
      plus5.addEventListener("click", function () { give(i, +5); });
      rows.push({ medals: li.querySelector(".tl-medals"), num: li.querySelector(".tl-n b"), numBox: li.querySelector(".tl-n"), minus: minus });
      listEl.appendChild(li); paintRow(i);

    }
    function rebuild() {                                                   // 명단이 바뀌었을 때: 행을 처음부터 다시 만듦 (받은 달란트는 그대로)
      emojis = assignEmoji(ROSTER);
      ROSTER.forEach(function (n) { if (!counts.hasOwnProperty(n)) counts[n] = 0; });
      listEl.innerHTML = ""; rows = [];
      buildRows(); paintTop();
    }
    buildRows();
    rosterTabs.push({                                                      // 반 관리에서 명단을 고치면 여기로 알려 줌
      kind: "talent",
      refresh: refresh,
      snapshot: function () { var o = {}; ROSTER.forEach(function (n) { o[n] = counts[n] || 0; }); return o; },
      restore: function (v) {                                              // 학기 기록을 되살릴 때: 모든 숫자를 바꾸고 서버에도 올림
        counts = {}; dirty = {};
        ROSTER.forEach(function (n) { counts[n] = v.tal[n] || 0; dirty[n] = true; });
        save(); rebuild(); flush();
      },
      rename: function (o, n) { counts[n] = counts[o] || 0; delete counts[o]; delete dirty[o]; dirty[n] = true; save(); rebuild(); flush(); },   // 서버의 같은 줄 이름은 반 관리가 함께 바꿈
      add: function (n, fromServer) { counts[n] = 0; if (!fromServer) dirty[n] = true; save(); rebuild(); if (!fromServer) flush(); },   // 서버에서 온 새 이름은 서버 숫자를 불러오고, 내가 추가한 이름은 0으로 올림

    if (window.MutationObserver) new MutationObserver(function () { if (!root.hidden) { refresh(); rosterRefresh(); } }).observe(root, { attributes: true, attributeFilter: ["hidden"] });

  }

  // ===================== 반 관리 (명단과 반 이름. 출석·달란트와 같은 명단을 씀) =====================
  // ----- 생일: 월·일만 (태어난 해는 받지 않음). 기기에는 새 키 하나(sunshine-class-birthday-v1)에 저장하고, 월과 일이 모두 정해지면 -----
  // ----- Supabase 반 명단 표의 birthday 칸(예: 10-18)에도 저장해서 다른 기기에서도 보입니다. (출석·달란트·명단·반 이름의 키와 기록은 건드리지 않음) -----
  var BDAY_KEY = "sunshine-class-birthday-v1";
  var BDAY_DAYS = [0, 31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];       // 달마다 날짜 수. 해를 받지 않으므로 2월은 29일까지
  var bdays = {};                                                           // 이름 → { m: 월 또는 null, d: 일 또는 null }  (월만 고른 것처럼 반쯤 고른 생일은 이 기기에만 둠)
  var bdayPending = {}, bdaySynced = false;                                 // 아직 서버에 못 올린 이름들 / 서버와 한 번이라도 맞춰 봤는지
  function bdayMax(m) { return m ? BDAY_DAYS[m] : 31; }
  function bdayHas(n) { return Object.prototype.hasOwnProperty.call(bdays, n); }
  function bdayFull(b) { return !!(b && b.m && b.d); }
  function bdayTwo(x) { return (x < 10 ? "0" : "") + x; }
  function bdayText(n) { var b = bdayHas(n) ? bdays[n] : null; return bdayFull(b) ? bdayTwo(b.m) + "-" + bdayTwo(b.d) : null; }   // 서버에 보낼 값: "10-18" (월과 일이 모두 있을 때만, 아니면 비움)
  function bdayKey(n) { return bdayHas(n) ? bdays[n].m + "/" + bdays[n].d : ""; }                                                     // 보내는 사이 또 바뀌었는지 비교용
  function bdayParse(str) {                                                  // 서버에서 온 "10-18"을 읽음 (이상한 값은 없는 것으로)
    var x = /^(\d\d)-(\d\d)$/.exec(String(str == null ? "" : str));
    if (!x) return null;
    var m = Number(x[1]), d = Number(x[2]);
    return m >= 1 && m <= 12 && d >= 1 && d <= bdayMax(m) ? { m: m, d: d } : null;
  }
  function bdayPendingCount() { return Object.keys(bdayPending).length; }
  function bdaySnapshot() { return JSON.stringify([bdays, Object.keys(bdayPending), bdaySynced]); }
  function bdaySave() { try { window.localStorage.setItem(BDAY_KEY, JSON.stringify({ v: 1, days: bdays, pending: Object.keys(bdayPending), synced: bdaySynced })); } catch (e) {} }
  function bdaySet(name, m, d) {                                            // 고르면 바로: 기기에 저장하고, 서버에도 올림 (안 되면 "못 올림"으로 기억해 두었다가 다시 올림)
    if (!m && !d) delete bdays[name]; else bdays[name] = { m: m, d: d };
    bdayPending[name] = true; bdaySave(); rosterKick();
  }
  (function bdayLoad() {                                                    // 저장된 생일을 읽음 (이상한 값과, 명단에 없는 이름은 버림)
    var o = null, changed = false;
    try { o = JSON.parse(window.localStorage.getItem(BDAY_KEY) || "null"); } catch (e) {}
    if (!o || typeof o !== "object") return;
    bdaySynced = o.synced === true;
    if (o.days && typeof o.days === "object") Object.keys(o.days).forEach(function (n) {
      var v = o.days[n] || {}, m = Math.floor(Number(v.m)), d = Math.floor(Number(v.d));
      m = m >= 1 && m <= 12 ? m : null; d = d >= 1 && d <= bdayMax(m) ? d : null;
      if (ROSTER.indexOf(n) < 0 || reservedName(n) || (!m && !d)) { changed = true; return; }
      bdays[n] = { m: m, d: d };
    });
    if (Array.isArray(o.pending)) o.pending.forEach(function (n) {
      if (typeof n === "string" && ROSTER.indexOf(n) > -1 && !reservedName(n)) bdayPending[n] = true; else changed = true;
    });
    if (changed) bdaySave();

    classEl.addEventListener("change", function () {
      var n = cleanName(classEl.value);
      if (!n) { classEl.value = currentClassName(); say("반 이름은 비워 둘 수 없어요.", true); return; }
      if (n.length > CLASS_MAX) { classEl.value = currentClassName(); say("반 이름은 " + CLASS_MAX + "글자까지 쓸 수 있어요.", true); return; }
      classEl.value = n; applyClassName(n); classChanged(n, true); say("반 이름을 바꿨어요: " + n);
    });
    renderList();
    // 서버에서 받았거나 학기 기록을 불러와서 명단이 바뀌면 이 화면도 새로 그림. 단, 지금 글자를 쓰는 중이면 끝난 뒤에 그림 (입력이 끊기지 않게)
    var redrawLater = false;
    function typingHere() { var a = document.activeElement; return !!(a && root.contains(a) && (a.tagName === "INPUT" || a.tagName === "SELECT")); }
    rosterWatchers.push(function () {
      if (typingHere()) { redrawLater = true; if (document.activeElement !== classEl) syncRows(); return; }
      renderList(); classEl.value = currentClassName(); say("");
    });
    root.addEventListener("focusout", function () {
      setTimeout(function () { if (redrawLater && !typingHere()) { redrawLater = false; renderList(); classEl.value = currentClassName(); } }, 0);
    });
    var syncEl = $(".mg-sync");
    rosterState.paint = function () { syncEl.hidden = !rosterState.bad; };                            // 연결이 안 될 때만 작게 "기기에만 저장 중"
    if (window.MutationObserver) new MutationObserver(function () { if (!root.hidden) rosterRefresh(); }).observe(root, { attributes: true, attributeFilter: ["hidden"] });
    rosterStart();                                                                                    // 페이지를 열면 서버에서 명단과 반 이름을 불러옴
  }

  var tablist = document.getElementById("tabs");
  var panels = document.getElementById("panels");
  var tabEls = [];
  var panelEls = [];

  TABS.forEach(function (pair, i) {
    var name = pair[0];
    var nameEn = pair[1];
    var tab = document.createElement("button");
    tab.type = "button";
    tab.setAttribute("role", "tab");
    tab.id = "tab-" + i;
    tab.setAttribute("aria-controls", "panel-" + i);
    tab.innerHTML = '<span class="ko"></span><span class="en" lang="en"></span>';
    tab.querySelector(".ko").textContent = name;
    tab.querySelector(".en").textContent = nameEn;
    tab.addEventListener("click", function () { select(i, false); });
    tablist.appendChild(tab);
    tabEls.push(tab);

    var panel = document.createElement("section");
    panel.setAttribute("role", "tabpanel");
    panel.id = "panel-" + i;
    panel.setAttribute("aria-labelledby", "tab-" + i);
    panel.tabIndex = 0;
    if (i === 0) {
      panel.className = "lesson";
      panel.innerHTML = LESSON_HTML;
    } else if (i === 1) {
      panel.className = "story";
      panel.innerHTML = STORY_HTML;
      initStory(panel);
    } else if (i === 2) {
      panel.className = "quiz";
      panel.innerHTML = QUIZ_HTML;
      initQuiz(panel);
    } else if (i === 3) {
      panel.className = "match";
      panel.innerHTML = MATCH_HTML;
      initMatch(panel);
    } else if (i === 4) {
      panel.className = "praise";
      panel.innerHTML = PRAISE_HTML;
    } else if (i === 5) {
      panel.className = "attend";
      panel.innerHTML = ATTEND_HTML;
      initAttend(panel);
    } else if (i === 6) {
      panel.className = "talent";
      panel.innerHTML = TALENT_HTML;
      initTalent(panel);
    } else if (i === 7) {
      panel.className = "manage";
      panel.innerHTML = MANAGE_HTML;
      initManage(panel);
    } else {
      panel.innerHTML = '<h2 class="panel-title"></h2><p class="panel-title-en" lang="en"></p>' +
        '<p class="panel-note">다음 주에 만듭니다</p><p class="panel-note-en" lang="en">Coming next week</p>';
      panel.querySelector(".panel-title").textContent = name;
      panel.querySelector(".panel-title-en").textContent = nameEn;
    }
    panels.appendChild(panel);
    panelEls.push(panel);
  });

  function select(index, focusTab) {
    tabEls.forEach(function (t, i) {
      var on = i === index;
      t.setAttribute("aria-selected", on ? "true" : "false");
      t.tabIndex = on ? 0 : -1;
      panelEls[i].hidden = !on;
    });
    if (focusTab) tabEls[index].focus();
  }

  // 키보드(좌우 화살표, Home, End) 지원
  tablist.addEventListener("keydown", function (e) {
    var cur = tabEls.indexOf(document.activeElement);
    if (cur < 0) return;
    var next = null;
    if (e.key === "ArrowRight") next = (cur + 1) % TABS.length;
    else if (e.key === "ArrowLeft") next = (cur - 1 + TABS.length) % TABS.length;
    else if (e.key === "Home") next = 0;
    else if (e.key === "End") next = TABS.length - 1;
    if (next !== null) { e.preventDefault(); select(next, true); }
  });

  // 수업 흐름: 지금 하는 단계 표시 (한 번에 하나, 다시 누르면 해제)
  panels.addEventListener("click", function (e) {
    var btn = e.target.closest ? e.target.closest(".step") : null;
    if (!btn) return;
    var wasOn = btn.getAttribute("aria-pressed") === "true";
    var all = panels.querySelectorAll(".step");
    for (var k = 0; k < all.length; k++) all[k].setAttribute("aria-pressed", "false");
    if (!wasOn) btn.setAttribute("aria-pressed", "true");
  });

  // 전체화면 버튼: 이 화면에서 브라우저가 허용할 때만 보임
  var fsBtn = document.getElementById("fs");
  var de = document.documentElement;
  if (fsBtn && document.fullscreenEnabled && de.requestFullscreen) {
    fsBtn.hidden = false;
    fsBtn.addEventListener("click", function () {
      try {
        if (document.fullscreenElement) document.exitFullscreen();
        else de.requestFullscreen();
      } catch (e) {}
    });
    document.addEventListener("fullscreenchange", function () {
      fsBtn.innerHTML = document.fullscreenElement
        ? '<span>전체화면 끝내기</span><span class="fs-en" lang="en">Exit full screen</span>'
        : '<span>전체화면</span><span class="fs-en" lang="en">Full screen</span>';
    });
  }

  select(0, false);
})();
</script>
</body>
</html>
